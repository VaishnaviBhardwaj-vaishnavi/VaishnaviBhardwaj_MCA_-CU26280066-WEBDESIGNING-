<!DOCTYPE html>
<html>
<head>
<title>Responsive Layout</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
}

header {
    background: brown;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
}

nav {
    display: flex;
    gap: 15px;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

.card {
    background: #f3dfc5;
    padding: 30px;
    text-align: center;
}

@media(max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 480px) {
    .container {
        grid-template-columns: 1fr;
    }

    header {
        flex-direction: column;
        gap: 10px;
    }
}

</style>
</head>

<body>

<header>
    <h2>Golden Crust</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Products</a>
    </nav>
</header>

<div class="container">

    <div class="card">Chocolate Cake</div>
    <div class="card">Fresh Bread</div>
    <div class="card">Cookies</div>

</div>

</body>
</html>
