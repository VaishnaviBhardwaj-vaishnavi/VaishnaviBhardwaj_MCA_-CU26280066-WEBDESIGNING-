<!DOCTYPE html>
<html>
<head>
<title>Mobile Responsive Website</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial;
    margin: 0;
}

header {
    background: brown;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
}

.box {
    background: #f5d6b5;
    padding: 40px;
    text-align: center;
}

@media(max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 480px) {
    .container {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<header>
<h1>Golden Crust Bakery</h1>
</header>

<div class="container">

<div class="box">Cakes</div>
<div class="box">Bread</div>
<div class="box">Cookies</div>

</div>

</body>
</html>
