<!DOCTYPE html>
<html>
<head>
<title>Modern Bakery Design</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffaf0;
    color: #4b3025;
}

header {
    background: #4b3025;
    color: white;
    padding: 25px;
    text-align: center;
}

section {
    padding: 50px;
    margin: 20px;
    background: #f5e6d3;
    border-radius: 10px;
}

h1 {
    font-size: 36px;
}

h2 {
    font-size: 28px;
}

p {
    font-size: 17px;
    line-height: 1.8;
}

button {
    background: #a65d32;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
}

</style>
</head>

<body>

<header>
    <h1>The Golden Crust</h1>
    <p>Freshly Baked Happiness</p>
</header>

<section>
    <h2>Welcome to Our Bakery</h2>

    <p>
        We provide fresh cakes, cookies, bread
        and pastries using quality ingredients.
    </p>

    <button>Explore Products</button>
</section>

</body>
</html>
