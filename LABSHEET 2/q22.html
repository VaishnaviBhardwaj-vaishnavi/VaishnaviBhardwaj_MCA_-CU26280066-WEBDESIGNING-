```html
<!DOCTYPE html>
<html>
<head>
    <title>Newsletter Subscription</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 50px;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px gray;
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: gray;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin: 25px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }

        label {
            position: absolute;
            left: 12px;
            top: 12px;
            background-color: white;
            padding: 0 5px;
            color: gray;
            transition: 0.3s;
            pointer-events: none;
        }

        input:focus {
            border: 2px solid blue;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -9px;
            font-size: 12px;
            color: blue;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Subscribe to Our Newsletter</h2>

        <p>Enter your email to receive the latest updates.</p>

        <form>

            <div class="input-box">

                <input type="email"
                       id="email"
                       name="email"
                       placeholder=" "
                       required>

                <label for="email">Email Address</label>

            </div>

            <button type="submit">Subscribe</button>

        </form>

    </div>

</body>
</html>
```
