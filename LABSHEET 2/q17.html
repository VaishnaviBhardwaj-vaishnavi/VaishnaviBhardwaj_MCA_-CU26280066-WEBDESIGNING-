```html
<!DOCTYPE html>
<html>
<head>
    <title>Hidden Input</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>User Form</h2>

    <form>

        <!-- Hidden Inputs -->
        <input type="hidden" name="session_id" value="ABC123">
        <input type="hidden" name="user_id" value="101">

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
