<!DOCTYPE html>
<html>
<head>
    <title>Employee Evaluation</title>

    <style>
        .form-group {
            margin-bottom: 15px;
        }

        label {
            float: left;
            width: 150px;
        }

        input, textarea {
            padding: 8px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

<h2>Employee Evaluation</h2>

<form>

<div class="form-group">
    <label>Employee Name:</label>
    <input type="text">
</div>

<div class="form-group">
    <label>Performance:</label>
    <input type="text">
</div>

<div class="form-group">
    <label>Comments:</label>
    <textarea></textarea>
</div>

<div class="clear"></div>

<button>Submit</button>

</form>

</body>
</html>
