<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

    <style>
        body {
            font-family: Arial;
            margin: 50px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            transition: 0.3s;
        }

        button:hover {
            background: green;
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

<h2>Upload File</h2>

<form>

    <input type="file">
    <br><br>

    <button type="submit">Upload</button>

</form>

</body>
</html>
