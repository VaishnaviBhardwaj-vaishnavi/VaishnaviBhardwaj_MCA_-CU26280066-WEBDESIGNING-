```html
<!DOCTYPE html>
<html>
<head>
    <title>Onboarding Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .box {
            width: 350px;
            margin: 70px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .step {
            display: none;
        }

        #step1 {
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            border: none;
            background: blue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        .back {
            background: gray;
        }

        .back:hover {
            background: #555;
        }

        .progress {
            text-align: center;
            color: gray;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="progress" id="progress">
        Step 1 of 3
    </div>

    <!-- Step 1 -->
    <div class="step" id="step1">

        <h2>Personal Details</h2>

        <input type="text"
               id="name"
               placeholder="Your Name"
               required>

        <button onclick="nextStep(1)">Next</button>

    </div>


    <!-- Step 2 -->
    <div class="step" id="step2">

        <h2>Contact Details</h2>

        <input type="email"
               id="email"
               placeholder="Your Email"
               required>

        <br>

        <button class="back" onclick="previousStep(2)">
            Back
        </button>

        <button onclick="nextStep(2)">
            Next
        </button>

    </div>


    <!-- Step 3 -->
    <div class="step" id="step3">

        <h2>Course Details</h2>

        <input type="text"
               id="course"
               placeholder="Your Course"
               required>

        <br>

        <button class="back" onclick="previousStep(3)">
            Back
        </button>

        <button onclick="finish()">
            Finish
        </button>

    </div>

</div>


<script>

function nextStep(step) {

    document.getElementById("step" + step).style.display = "none";

    document.getElementById("step" + (step + 1)).style.display = "block";

    document.getElementById("progress").innerHTML =
        "Step " + (step + 1) + " of 3";
}


function previousStep(step) {

    document.getElementById("step" + step).style.display = "none";

    document.getElementById("step" + (step - 1)).style.display = "block";

    document.getElementById("progress").innerHTML =
        "Step " + (step - 1) + " of 3";
}


function finish() {

    alert("Onboarding completed successfully!");

}

</script>

</body>
</html>
```
