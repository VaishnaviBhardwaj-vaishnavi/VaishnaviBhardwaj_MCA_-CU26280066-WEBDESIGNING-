<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background: lightgray;
            font-family: Arial;
        }

        .card {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
            position: relative;
        }

        .icon {
            position: absolute;
            top: 10px;
            right: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="card">

    <span class="icon">🔒</span>

    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>

</div>

</body>
</html>
