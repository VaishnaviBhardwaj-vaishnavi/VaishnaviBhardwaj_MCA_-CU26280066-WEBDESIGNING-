<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Table</title>

    <style>
        table {
            width: 600px;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid black;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

        tr:hover {
            background-color: lightblue;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">Student Data</h2>

<form>

<table>

<tr>
    <th>Name</th>
    <th>Course</th>
    <th>Marks</th>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

</table>

</form>

</body>
</html>
