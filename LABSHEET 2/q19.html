<!DOCTYPE html>
<html>
<head>
    <title>Typography Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        label {
            font-family: Georgia;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            padding: 10px;
        }

        input::placeholder {
            font-family: Arial;
            letter-spacing: 1px;
            text-transform: capitalize;
        }
    </style>
</head>

<body>

<h2>Registration Form</h2>

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<br><br>

<label>Email</label>
<input type="email" placeholder="Enter your email">

<br><br>

<label>Address</label>
<input type="text" placeholder="Enter your address">

</form>

</body>
</html>
