<!DOCTYPE html>
<html>
<head>
    <title>List Types</title>
</head>
<body>

    <h1>Roman Numerals</h1>

    <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h1>Lowercase Letters</h1>

    <ol type="a">
        <li>Python</li>
        <li>Java</li>
        <li>C++</li>
    </ol>

</body>
</html>
