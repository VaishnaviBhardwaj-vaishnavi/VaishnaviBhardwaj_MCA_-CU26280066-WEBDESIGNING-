<!DOCTYPE html>
<html>
<body>

<script>
let marks = Number(prompt("Enter marks:"));
let grade;

if (marks >= 90)
    grade = "A";
else if (marks >= 80)
    grade = "B";
else if (marks >= 70)
    grade = "C";
else if (marks >= 60)
    grade = "D";
else
    grade = "F";

switch (grade) {
    case "A":
        alert("Grade A - Excellent");
        break;

    case "B":
        alert("Grade B - Very Good");
        break;

    case "C":
        alert("Grade C - Good");
        break;

    case "D":
        alert("Grade D - Pass");
        break;

    default:
        alert("Grade F - Fail");
}
</script>

</body>
</html>
