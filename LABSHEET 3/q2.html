<!DOCTYPE html>
<html>
<body>

<div id="result"></div>

<script>
let n = Number(prompt("Enter a number:"));
let isPrime = true;

if (n <= 1) {
    isPrime = false;
}

for (let i = 2; i < n; i++) {
    if (n % i === 0) {
        isPrime = false;
        break;
    }
}

if (isPrime) {
    document.getElementById("result").innerHTML =
        n + " is a Prime Number";
} else {
    document.getElementById("result").innerHTML =
        n + " is a Composite Number";
}
</script>

</body>
</html>
